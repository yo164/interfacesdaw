<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bola de Dragón</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <header>
    <div id="header-top" class="header-top">
        <h1>Dragon Ball Z</h1>

        <nav>
            <a href="#" id="home">Inicio</a>
            <a href="#" id="personajes">Personajes</a>
            <a href="#" id="planetas">Planetas</a>
            <a href="#" id="transformaciones">Transformaciones</a>
        </nav>
    </div>

    <div id="search-container" class="search-container">
     
    </div>
</header>

<main id="main">

     <section id="filters" class="filters">
        <div class="filter">
            <label for="race">Raza</label>
            <select id="race" name="race">
                <option value="">Raza</option>
            </select>
        </div>

        <div class="filter">
            <label for="gender">Género</label>
            <select id="gender" name="gender">
                <option value="">Género</option>
            </select>
        </div>

        <div class="filter">
            <label for="affiliation">Afiliación</label>
            <select id="affiliation" name="affiliation">
                <option value="">Afiliación</option>
            </select>
        </div>

        <button id="filter-button" type="button">Filtrar</button>

    </section>

    <section id="principal" class="principal">
    </section>


</main>

    
</body>
</html>
